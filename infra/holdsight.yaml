AWSTemplateFormatVersion: "2010-09-09"
Description: HoldSight demo - OpenCV (COOL) on EC2 Graviton4 behind CloudFront
Parameters:
  CoolAmiId: {Type: AWS::EC2::Image::Id}
  InstanceType: {Type: String, Default: m8g.xlarge}
  CodeBucket: {Type: String, Description: Private S3 bucket holding the source tarball}
  CodeKey: {Type: String, Default: src/holdsight-src.tgz}
  CfPrefixList: {Type: String, Default: pl-22a6434b}
Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore, arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy]
      Policies:
        - PolicyName: read-src
          PolicyDocument:
            Statement:
              - {Effect: Allow, Action: [s3:GetObject], Resource: !Sub "arn:aws:s3:::${CodeBucket}/src/*"}
      Tags: [{Key: Project, Value: holdsight}]
  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref Role]}
  Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HoldSight - port 8000 from CloudFront origin-facing only, no SSH
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourcePrefixListId: !Ref CfPrefixList}
      Tags: [{Key: Project, Value: holdsight}]
  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref CoolAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref Profile
      SecurityGroupIds: [!GetAtt Sg.GroupId]
      MetadataOptions: {HttpTokens: required}
      Monitoring: false
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {VolumeSize: 50, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Project, Value: holdsight}, {Key: Name, Value: holdsight-demo}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > /var/log/holdsight-setup.log 2>&1
          set -x
          mkdir -p /opt/holdsight && cd /opt/holdsight
          PYB=$(command -v python3)
          $PYB -m venv --system-site-packages .venv || { (apt-get update && apt-get install -y python3-venv) || dnf install -y python3-pip; $PYB -m venv --system-site-packages .venv; }
          set +x
          .venv/bin/pip install -q boto3
          .venv/bin/python -c "import boto3; boto3.client('s3', region_name='${AWS::Region}').download_file('${CodeBucket}', '${CodeKey}', '/opt/src.tgz')"
          set -x
          tar xzf /opt/src.tgz -C /opt
          grep -v '^opencv-python-headless' requirements.lock > /tmp/req.txt
          .venv/bin/pip install -r /tmp/req.txt
          .venv/bin/python -c "import cv2; print('CV2', cv2.__version__, cv2.__file__)" || .venv/bin/pip install opencv-python-headless==5.0.0.93
          bash scripts/fetch_models.sh
          # Second venv that uses the COOL build shipped in the AMI instead of the pip wheel
          python3 -m venv .venv-cool && .venv-cool/bin/pip install -r /tmp/req.txt
          printf 'PYTHONPATH=/opt/cool/python_3.12/site-packages/cv2/python-3.12\nLD_LIBRARY_PATH=/opt/cool/cpp_sdk/lib\n' > cool.env
          cat > /etc/systemd/system/holdsight.service <<UNIT
          [Unit]
          After=network-online.target
          [Service]
          WorkingDirectory=/opt/holdsight
          ExecStart=/opt/holdsight/.venv-cool/bin/python -m uvicorn holdsight.api:app --host 0.0.0.0 --port 8000
          Restart=always
          RestartSec=3
          User=nobody
          Environment=HOLDSIGHT_TMP=/dev/shm
          EnvironmentFile=/opt/holdsight/cool.env
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload && systemctl enable --now holdsight
          echo SETUP_DONE
  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags: [{Key: Project, Value: holdsight}]
      DistributionConfig:
        Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: api
            DomainName: !GetAtt Host.PublicDnsName
            CustomOriginConfig: {HTTPPort: 8000, OriginProtocolPolicy: http-only, OriginReadTimeout: 60}
        DefaultCacheBehavior:
          TargetOriginId: api
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          Compress: true
  RecoverAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Auto-recover instance on system status check failure
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{Name: InstanceId, Value: !Ref Host}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Sub "arn:aws:automate:${AWS::Region}:ec2:recover"]
  RebootAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Reboot instance on instance status check failure
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_Instance
      Dimensions: [{Name: InstanceId, Value: !Ref Host}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Sub "arn:aws:automate:${AWS::Region}:ec2:reboot"]
  HealthCheck:
    Type: AWS::Route53::HealthCheck
    Properties:
      HealthCheckConfig:
        Type: HTTPS
        FullyQualifiedDomainName: !GetAtt Cdn.DomainName
        ResourcePath: /v1/health
        Port: 443
        RequestInterval: 30
        FailureThreshold: 3
      HealthCheckTags: [{Key: Project, Value: holdsight}, {Key: Name, Value: holdsight-endpoint}]
  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: InstanceId, Value: !Ref Host}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
Outputs:
  Url: {Value: !Sub "https://${Cdn.DomainName}/"}
  InstanceId: {Value: !Ref Host}
  HealthCheckId: {Value: !Ref HealthCheck}
